# Actions 탭에서 Run workflow를 누르면 package.json의 버전으로 릴리스를 만들고,
# Windows 설치 파일과 Mac dmg를 빌드해서 그 릴리스에 올린다. 사용자 앱은 여기 올라온 새 버전을 보고 업데이트한다.
name: release

on:
  workflow_dispatch:
    inputs:
      target:
        description: '빌드할 대상'
        type: choice
        options: [all, mac, windows]
        default: all

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 버전 태그와 릴리스 만들기
        run: |
          V="v$(node -p "require('./package.json').version")"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "$V 릴리스가 이미 있어서 거기에 파일을 다시 올린다"
          else
            gh release create "$V" --title "$V" --notes-file .github/release-notes.md --target "$GITHUB_SHA"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # Mac은 Intel 서버에서 빌드 (Apple 실리콘 서버는 자주 붐빔). Intel 서버에서도 arm64 앱이 만들어진다.
        os: ${{ fromJSON(inputs.target == 'mac' && '["macos-15-intel"]' || inputs.target == 'windows' && '["windows-latest"]' || '["windows-latest","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 최신 공고를 앱 기본 데이터로 넣기 (실패하면 샘플 유지)
        shell: bash
        run: curl -fsSL https://mmmmmjjjjj26-cmd.github.io/benefit-calendar/data.json -o /tmp/d.json && mv /tmp/d.json web/data/data.json || echo '샘플 데이터 사용'
      - run: npm run bundle-data
      - name: 빌드하고 릴리스에 올리기
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
