# Actions 탭에서 Run workflow를 누르면 (또는 v로 시작하는 태그를 올리면) Windows 설치 파일과 Mac dmg를 빌드해서 GitHub Releases에 올린다.
# 사용자 앱은 여기 올라온 새 버전을 보고 업데이트한다.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run bundle-data
      - name: 빌드하고 Releases에 올리기
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
