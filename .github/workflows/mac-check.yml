# Mac 앱이 실제로 켜지는지 확인한다. 빌드만 하고 릴리스에는 올리지 않는다.
name: mac-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run bundle-data
      - name: 실행 테스트
        run: |
          set +e
          try() { echo "=== $1"; shift; ELECTRON_ENABLE_LOGGING=1 "$@" > run.log 2>&1 & P=$!; sleep 12
            if kill -0 $P 2>/dev/null; then echo "RESULT: OK"; kill $P; else wait $P; echo "RESULT: 종료 exit=$?"; fi; head -15 run.log; }
          E=node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
          try "기본 Electron, 빈 앱" $E --version
          echo 'require("electron").app.whenReady().then(()=>{const w=new (require("electron").BrowserWindow)();w.loadURL("about:blank")})' > /tmp/min.js
          try "기본 Electron, 최소 창" $E /tmp/min.js
          try "기본 Electron, 우리 앱" $E .
          npx electron-builder --mac dir --arm64 --publish never -c.productName=BenefitCalendar > /dev/null 2>&1
          try "빌드, 영문 이름" "dist/mac-arm64/BenefitCalendar.app/Contents/MacOS/BenefitCalendar"
