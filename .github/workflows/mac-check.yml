# Mac 앱이 실제로 켜지는지 확인한다. dmg를 만들어 설치하는 과정까지 흉내 내고, 릴리스에는 올리지 않는다.
name: mac-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run bundle-data
      - run: npx electron-builder --mac dmg --arm64 --publish never
      - name: dmg에서 설치하고 15초 실행
        run: |
          set +e
          DMG=$(ls dist/*.dmg | head -1); echo "DMG=$DMG"
          hdiutil attach "$DMG" -mountpoint /tmp/dmg -nobrowse -quiet
          cp -R /tmp/dmg/BenefitCalendar.app /tmp/; hdiutil detach /tmp/dmg -quiet
          codesign --verify --deep --strict /tmp/BenefitCalendar.app && echo "SIGN: OK"
          /tmp/BenefitCalendar.app/Contents/MacOS/BenefitCalendar > run.log 2>&1 & P=$!; sleep 15
          if kill -0 $P 2>/dev/null; then echo "RESULT: OK"; kill $P; else wait $P; echo "RESULT: 종료 exit=$?"; head -20 run.log; fi
